name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-sh:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: find . -name "*.sh" | xargs shellcheck -x --source-path=SCRIPTDIR

  lint-ps1:
    name: Lint PowerShell scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter "*.ps1"
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName }
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  install-linux:
    name: Install on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run installer
        run: bash install.sh

  install-macos:
    name: Install on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run installer
        run: bash install.sh

  install-windows:
    name: Install on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run installer
        shell: pwsh
        run: .\install.ps1

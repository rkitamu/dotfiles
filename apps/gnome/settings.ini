# GNOME settings (power / mouse only)
#
# このファイルは apps/gnome/export.sh の生成物。直接編集しないこと。
# 値を変えるときは GNOME の設定 UI か gsettings で変更してから export.sh を実行する。
# 各キーの意味は README.md の gnome セクションを参照。
#
# 反映: bash apps/gnome/install.sh

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-timeout=7200
sleep-inactive-ac-type='nothing'

[org/gnome/desktop/session]
idle-delay=uint32 10800

[org/gnome/desktop/peripherals/mouse]
speed=-0.53846153846153844

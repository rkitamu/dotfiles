onboarding = false
[keys]
# prefix はホームポジションで押せる ctrl+k (シェルの kill-line ^K は潰れる)。
# 巡回系のみ直接キー (右手ホームポジション): alt+y=ワークスペース / alt+u=エージェント / alt+i=タブ / alt+o=ペイン。
prefix = "ctrl+k"
cycle_pane_next = ["prefix+tab", "alt+o"]
next_tab        = ["prefix+n", "alt+i"]
next_agent      = ["alt+u"]
next_workspace  = ["alt+y"]

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[ui.toast]
# "system" は osascript 発行になりクリック先を指定できない (テキストエディットが開く)。
# "terminal" ならホスト端末が発行元になり、クリックでその端末にフォーカスが戻る。
delivery = "terminal"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

# MongoDB 風グリーン(ネイビー地 + 緑アクセント)。catppuccin をベースにトークンだけ上書き。
# 背景をホスト端末に合わせたいときは panel_bg を "reset" にする。
[theme.custom]
accent        = "#13aa52"
panel_bg      = "#001e2b"
surface0      = "#0a2a36"
surface1      = "#123a44"
surface_dim   = "#00161f"
overlay0      = "#3d5a63"
overlay1      = "#5a7a84"
text          = "#e3fcf7"
subtext0      = "#9ab8b5"
green         = "#00ed64"
teal          = "#2dd4bf"
mauve         = "#5eead4"
blue          = "#4fb3d9"
yellow        = "#e0c36a"
peach         = "#e8a06a"
red           = "#ef6a6a"

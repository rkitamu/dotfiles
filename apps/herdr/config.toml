onboarding = false
[keys]
# prefix はホームポジションで押せる ctrl+k (シェルの kill-line ^K は潰れる)。
# 巡回系のみ直接キー: alt+o=ペイン / alt+n=タブ / alt+w=ワークスペース。
prefix = "ctrl+k"
cycle_pane_next = ["prefix+tab", "alt+o"]
next_tab        = ["prefix+n", "alt+n"]
next_workspace  = ["alt+w"]

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false
